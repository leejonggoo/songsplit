[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songsplit"
version = "0.1.0"
description = "Audio track separation + MIDI transcription pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydub>=0.25",
    "librosa>=0.10",
    "music21>=9.1",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "streamlit>=1.36",
    "plotly>=5.22",
    "demucs>=4.0",
    "basic-pitch>=0.3",
    # resampy(basic-pitch 의존성)가 아직 pkg_resources를 사용함. setuptools>=81에서 제거되어 핀 고정.
    "setuptools<81",
]

[project.optional-dependencies]
# Phase 7: 대안/실험적 분리 엔진. tensorflow 버전 충돌 가능성이 있어 기본 설치에서 분리.
spleeter = ["spleeter>=2.4"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
songsplit = ["stages/gp_templates.xml"]
